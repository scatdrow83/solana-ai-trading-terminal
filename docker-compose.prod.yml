services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set a unique APP_SECRET_KEY of at least 32 characters}
      DATABASE_URL: ${SUPABASE_DATABASE_URL:?Set the production Supabase Postgres connection string}
      DATABASE_SCHEMA: terminal
      DATABASE_INITIALIZE: "false"
      SESSION_COOKIE_SECURE: "true"
      LOCAL_SECURITY_SIMULATOR: "false"
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set a comma-separated production admin email allowlist}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?Set a unique 64-character admin bootstrap token}
      MARKET_DISCOVERY_TOKEN: ${MARKET_DISCOVERY_TOKEN:?Set a unique 64-character hexadecimal discovery token}
      RATELIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?Generate REDIS_PASSWORD with openssl rand -hex 32}@redis:6379/0
      TRADING_MODE: live
      LIVE_TRADING_ENABLED: "true"
      JUPITER_API_KEY: ${JUPITER_API_KEY:?Set the production Jupiter API key}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:?Set a production Solana RPC endpoint}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4001
      API_INTERNAL_URL: http://api:4000
      MARKET_DISCOVERY_TOKEN: ${MARKET_DISCOVERY_TOKEN:?Set a unique 64-character hexadecimal discovery token}
      MARKET_DISCOVERY_INTERVAL_MS: ${MARKET_DISCOVERY_INTERVAL_MS:-30000}
    expose:
      - "4001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate REDIS_PASSWORD with openssl rand -hex 32}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Generate REDIS_PASSWORD with openssl rand -hex 32}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set the public production hostname in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for TLS certificate notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  redis_data:
