services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solana_terminal}
      POSTGRES_USER: ${POSTGRES_USER:-solana_terminal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-staging-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      APP_ENV: staging-local
      DATABASE_SCHEMA: public
      DATABASE_INITIALIZE: "true"
      TRADING_MODE: live
      LIVE_TRADING_ENABLED: "true"
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-solana_terminal}:${POSTGRES_PASSWORD:-local-staging-change-this-password}@db:5432/${POSTGRES_DB:-solana_terminal}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-staging-session-secret-change-before-deploy}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOCAL_SECURITY_SIMULATOR: ${LOCAL_SECURITY_SIMULATOR:-true}
      RATELIMIT_STORAGE_URI: memory://
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4001
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-4001}:4001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
